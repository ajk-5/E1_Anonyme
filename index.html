<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Découvrez les projets et les formations de WebCraft Solutions.">
    <title>WebCraft Solutions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="js/main.js" defer></script>
</head>
<body>
    <header>
        <nav aria-label="Navigation principale">
            <a class="logo" href="index.html">WebCraft Solutions</a>
            <a href="#accueil">Accueil</a>
            <a href="#projets">Projets</a>
            <a href="#formations">Formations</a>
            <a href="inscription.html">Inscription</a>
        </nav>
    </header>

    <main>
        <section id="accueil" class="hero">
            <h1>WebCraft Solutions</h1>
            <p>Découvrez nos projets et apprenez de nouvelles compétences.</p>
        </section>

        <section id="projets">
            <h2>Nos projets</h2>
            <div class="filtres">
                <div><label for="recherche">Recherche</label><input id="recherche" class="form-control" type="search" placeholder="Titre ou client" disabled></div>
                <div><label for="techno">Technologie</label><select id="techno" class="form-select" disabled><option value="">Toutes les technologies</option></select></div>
                <div><label for="categorie">Catégorie</label><select id="categorie" class="form-select" disabled><option value="">Toutes les catégories</option></select></div>
            </div>
            <div id="chargement" class="loader" role="status" aria-label="Chargement des projets"></div>
            <p id="erreur" class="text-danger" role="alert"></p>
            <p id="total" role="status"></p>
            <div id="portfolio" class="grille"></div>
        </section>

        <section id="formations">
            <h2>Nos formations</h2>
            <div class="filtres">
                <div><label for="chercher">Recherche</label><input id="chercher" class="form-control" type="search" placeholder="Titre de la formation" disabled></div>
                <div><label for="domaine">Catégorie</label><select id="domaine" class="form-select" disabled><option value="">Toutes les catégories</option></select></div>
                <div><label for="niveau">Niveau</label><select id="niveau" class="form-select" disabled><option value="">Tous les niveaux</option></select></div>
                <div><label for="technologie">Technologie</label><select id="technologie" class="form-select" disabled><option value="">Toutes les technologies</option></select></div>
            </div>
            <div id="attente" class="loader" role="status" aria-label="Chargement des formations"></div>
            <p id="probleme" class="text-danger" role="alert"></p>
            <p id="nombre" role="status"></p>
            <div id="catalogue" class="grille"></div>
        </section>
       
    </main>

    <!-- only one Bootstrap, remplie selon la carte choisie -->
    <div class="modal fade" id="details" role="dialog" tabindex="-1" aria-labelledby="titre" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="titre">Détails</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
                </div>
                <div class="modal-body" id="contenu"></div>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 WebCraft Solutions</p>
        <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=RDdQw4w9WgXcQ&start_radio=1" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=RDdQw4w9WgXcQ&start_radio=1" target="_blank" rel="noopener">Instagram</a>
    </footer>
</body>
</html>
