<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inscription - WebCraft Solutions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body>
    <header>
        <nav aria-label="Navigation principale">
            <a class="logo" href="index.html">WebCraft Solutions</a>
            <a href="index.html#accueil">Accueil</a>
            <a href="index.html#projets">Projets</a>
            <a href="index.html#formations">Formations</a>
            <a href="inscription.html" aria-current="page">Inscription</a>
        </nav>
    </header>
    <main>
        <h1>Inscription à une formation</h1>
        <p>Les champs marqués * sont obligatoires.</p>
        <p>Formulaire de démonstration : aucune donnée n’est envoyée.</p>
        <div id="attente" class="loader" role="status" aria-label="Chargement des formations"></div>
        <p id="probleme" class="text-danger" role="alert"></p>
        <p id="succes" class="alert alert-success" role="status" hidden></p>

        <form id="inscription" novalidate>
            <label for="prenom">Prénom *</label>
            <input id="prenom" name="prenom" class="form-control" autocomplete="given-name" required aria-describedby="prenomerreur">
            <p id="prenomerreur" class="message" aria-live="polite"></p>

            <label for="nom">Nom *</label>
            <input id="nom" name="nom" class="form-control" autocomplete="family-name" required aria-describedby="nomerreur">
            <p id="nomerreur" class="message" aria-live="polite"></p>

            <label for="email">Email *</label>
            <input id="email" name="email" class="form-control" type="email" autocomplete="email" required aria-describedby="emailerreur">
            <p id="emailerreur" class="message" aria-live="polite"></p>

            <label for="telephone">Téléphone *</label>
            <input id="telephone" name="telephone" class="form-control" type="tel" autocomplete="tel" placeholder="+33 6 12 34 56 78" required aria-describedby="telephoneerreur">
            <p id="telephoneerreur" class="message" aria-live="polite"></p>

            <label for="formation">Formation *</label>
            <select id="formation" name="formation" class="form-select" required disabled aria-describedby="formationerreur">
                <option value="">Choisir une formation</option>
            </select>
            <p id="formationerreur" class="message" aria-live="polite"></p>

            <label for="niveau">Niveau *</label>
            <select id="niveau" name="niveau" class="form-select" required aria-describedby="niveauerreur">
                <option value="">Choisir votre niveau</option>
                <option>Débutant</option>
                <option>Intermédiaire</option>
                <option>Avancé</option>
            </select>
            <p id="niveauerreur" class="message" aria-live="polite"></p>

            <label for="motivation">Motivation * (50 caractères minimum)</label>
            <textarea id="motivation" name="motivation" class="form-control" rows="4" required aria-describedby="motivationerreur"></textarea>
            <p id="motivationerreur" class="message" aria-live="polite"></p>

            <label for="entreprise">Entreprise (facultatif)</label>
            <input id="entreprise" name="entreprise" class="form-control mb-3" autocomplete="organization">

            <label for="experience">Expérience en années (facultatif)</label>
            <input id="experience" name="experience" class="form-control mb-3" type="number" min="0" step="1">

            <button id="envoyer" class="btn btn-primary" type="submit" disabled>S’inscrire</button>
        </form>
        <noscript><p>Activez JavaScript pour utiliser le formulaire.</p></noscript>
    </main>
    <footer><p>© 2026 WebCraft Solutions</p></footer>
</body>
</html>
